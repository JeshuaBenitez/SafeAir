server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to backend service
  # La URL se reemplaza en tiempo de build por API_BASE_URL
  # Docker Compose / LAN: http://api:3000 o http://192.168.x.x:3000
  # Render producción: https://safeair-api.onrender.com (habilitar HTTPS abajo si es necesario)
  location /api/ {
    # PLACEHOLDER_API_URL se reemplaza por sed en tiempo de build
    # docker-compose: api:3000 → proxy_pass http://api:3000/api/
    # LAN: 192.168.1.100:3000 → proxy_pass http://192.168.1.100:3000/api/
    # Render: safeair-api.onrender.com → proxy_pass https://safeair-api.onrender.com/api/
    proxy_pass http://PLACEHOLDER_API_URL/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
  }
}
