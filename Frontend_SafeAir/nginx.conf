server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to backend service
  # En local (Docker Compose): http://api:3000
  # En production (Render): usar variable de entorno API_BASE_URL o passar como argumento
  location /api/ {
    # Si API_BASE_URL está definido, úsalo; si no, usa api:3000 (Docker Compose)
    set $upstream http://api:3000;
    
    # En producción, esto se puede cambiar con argumento en build
    # Ejemplo: docker build --build-arg API_BASE_URL=https://tu-api.onrender.com
    
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
  }
}
