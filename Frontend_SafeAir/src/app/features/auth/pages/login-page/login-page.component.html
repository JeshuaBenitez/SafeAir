<sa-auth-shell>
  <sa-auth-card title="" subtitle="">
    <sa-auth-header />

    <ng-container *ngIf="state$ | async as state">
      <sa-login-form
        [loading]="state.loading"
        [error]="state.error"
        (submitCredentials)="onLogin($event)"
      />

      <output *ngIf="state.session" class="login-page__success" aria-live="polite">
        Inicio de sesion simulado exitoso. Bienvenido, {{ state.session.displayName }}.
      </output>
    </ng-container>
  </sa-auth-card>
</sa-auth-shell>
