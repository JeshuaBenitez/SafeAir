<label class="form-field" [attr.for]="id">
  <span class="form-field__label">{{ label }}</span>
  <span class="form-field__input-wrap" [class.is-invalid]="!!error">
    <img *ngIf="leftIconSrc" class="form-field__icon" [src]="leftIconSrc" [alt]="leftIconAlt" aria-hidden="true" />
    <input
      class="form-field__input"
      [id]="id"
      [type]="type"
      [placeholder]="placeholder"
      [formControl]="control"
      [attr.autocomplete]="autocomplete"
      [attr.aria-invalid]="error ? true : null"
      [attr.aria-disabled]="control.disabled"
      [attr.aria-describedby]="hint || error ? id + '-desc' : null"
    />
  </span>
  <span *ngIf="hint || error" [id]="id + '-desc'" class="form-field__hint" [ngClass]="{ 'is-error': !!error }">
    {{ error || hint }}
  </span>
</label>
