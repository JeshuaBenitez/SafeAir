services:
  # =============================================
  # PostgreSQL - Base de datos
  # =============================================
  db:
    image: postgres:16
    container_name: safeair-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeair}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "6543:5432"  # Puerto externo: interno
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Api_Emuladores/database/sql:/docker-entrypoint-initdb.d:Z
    networks:
      safeair-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # MariaDB - Base destino para practica ENLACE
  # =============================================
  mariadb:
    profiles:
      - enlace
    image: mariadb:11
    container_name: safeair-enlace-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${ENLACE_MARIADB_DB:-enlace_mariadb}
      MARIADB_USER: ${ENLACE_MARIADB_USER:-mariadb}
      MARIADB_PASSWORD: ${ENLACE_MARIADB_PASSWORD:-1234567890}
      MARIADB_ROOT_PASSWORD: ${ENLACE_MARIADB_ROOT_PASSWORD:-1234567890}
    ports:
      - "${ENLACE_MARIADB_PORT:-3306}:3306"
    volumes:
      - enlace_mariadb_data:/var/lib/mysql
    networks:
      - safeair-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =============================================
  # SQL Server - Base destino para practica ENLACE
  # =============================================
  sqlserver:
    profiles:
      - enlace
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: safeair-enlace-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${ENLACE_MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${ENLACE_SQLSERVER_PASSWORD:-Hallo1505}
    ports:
      - "${ENLACE_SQLSERVER_PORT:-1433}:1433"
    volumes:
      - enlace_sqlserver_data:/var/opt/mssql
    networks:
      - safeair-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # =============================================
  # EMQX - Broker MQTT (OBLIGATORIO, no cambiar a Mosquitto)
  # =============================================
  mqtt:
    image: emqx/emqx:latest
    container_name: safeair-mqtt
    restart: unless-stopped
    env_file:
      - ./.env.emqx
    environment:
      # EMQX permite conexiones anónimas para desarrollo local
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_LOG_LEVEL: "info"
      EMQX_DASHBOARD__LISTENERS__HTTP__INET6: "false"
    ports:
      - "1883:1883"    # MQTT TCP - para emuladores
      - "8883:8883"    # MQTT over TLS - para producción segura
      - "8084:8084"    # MQTT WebSocket - para frontend/suscriptores web
      - "18083:18083"  # Dashboard EMQX - solo para debugging local
    volumes:
      - mqtt_data:/opt/emqx/data
      - mqtt_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - safeair-network

  # =============================================
  # API / Backend - Servicio principal
  # =============================================
  api:
    build:
      context: ./Api_Emuladores
    container_name: safeair-api
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-safeair-api-local}
      BACKEND_BIND_HOST: ${API_HOST:-0.0.0.0}
      BACKEND_PORT: 3000
      PORT: 3000
      # CORS dinámico desde .env/.env.docker
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8080,http://frontend:80}
      # OTP habilitado por defecto. Para demos sin correo: AUTH_SKIP_OTP=true en .env.docker
      AUTH_SKIP_OTP: ${AUTH_SKIP_OTP:-false}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    ports:
      - "3000:3000"  # Puerto para acceder desde otra laptop en LAN
    networks:
      - safeair-network

  # =============================================
  # Frontend - Interfaz de usuario
  # =============================================
  frontend:
    build:
      context: ./Frontend_SafeAir
      args:
        # Docker local: Nginx proxya /api hacia http://api:3000
        # LAN/Tailscale: usar un host:puerto alcanzable desde el contenedor Nginx
        API_BASE_URL: ${API_BASE_URL:-api:3000}
    container_name: safeair-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"  # Puerto HTTP
      - "8443:443" # Puerto HTTPS (si se configura SSL)
    networks:
      - safeair-network

  # =============================================
  # Emuladores - Dispositivos IoT simulados
  # =============================================
  emulator-java:
    profiles:
      - emulator
    build:
      context: ./SafeAir-System-Emulator
      dockerfile: Dockerfile
    container_name: safeair-emulator-java
    restart: unless-stopped
    environment:
      # Conectar a EMQX en el mismo equipo (docker-compose)
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS_ENABLED: "false"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_CONSOLE_LOG_ENABLED: "true"
      # Perfil local con 3 emuladores. Ajustar en .env.docker al usuario provisionado actual.
      SAFEAIR_EMULATOR_ID_1: ${SAFEAIR_EMULATOR_ID_1:-EMU-U001-R001}
      SAFEAIR_EMULATOR_ID_2: ${SAFEAIR_EMULATOR_ID_2:-EMU-U001-R002}
      SAFEAIR_EMULATOR_ID_3: ${SAFEAIR_EMULATOR_ID_3:-EMU-U001-R003}
      SPRING_PROFILES_ACTIVE: profile1
    depends_on:
      mqtt:
        condition: service_healthy
    ports:
      - "8081:8080"  # Puerto para debugging del emulador Java
    networks:
      - safeair-network

# =============================================
# Volumes persistentes
# =============================================
volumes:
  db_data:
  enlace_mariadb_data:
  enlace_sqlserver_data:
  mqtt_data:
  mqtt_log:

# =============================================
# Red de Docker
# =============================================
networks:
  safeair-network:
    driver: bridge
