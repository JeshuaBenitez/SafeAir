services:
  db:
    image: postgres:16
    container_name: safeair-db
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "6543:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Api_Emuladores/database/sql:/docker-entrypoint-initdb.d:Z
    networks:
      - safeair-network

  mqtt:
    image: emqx/emqx:latest
    container_name: safeair-mqtt
    restart: unless-stopped
    env_file:
      - ./.env.emqx
    environment:
      # Configuración de producción - valores por defecto安全感
      EMQX_ALLOW_ANONYMOUS: "${EMQX_ALLOW_ANONYMOUS:-false}"
      EMQX_LOG_LEVEL: "${EMQX_LOG_LEVEL:-warning}"
      EMQX_DASHBOARD__SECRETS__JWT_SECRET: "${EMQX_JWT_SECRET:-change_this_to_a_secure_random_string}"
      EMQX_DEFAULT_ADMIN_PASSWORD: "${EMQX_ADMIN_PASSWORD:-}"
    ports:
      - "1883:1883"      # MQTT TCP (externo solo si es necesario en producción)
      - "8883:8883"      # MQTT over TLS
      - "8084:8084"      # WebSocket MQTT
      # - "18083:18083"  # Dashboard - NO exponer en producción sin VPN
    volumes:
      - mqtt_data:/opt/emqx/data
      - mqtt_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - safeair-network

  api:
    build:
      context: ./Api_Emuladores
    container_name: safeair-api
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MQTT_URL: mqtt://mqtt:1883
      BACKEND_BIND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - safeair-network

  frontend:
    build:
      context: ./Frontend_SafeAir
    container_name: safeair-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - safeair-network

  # Emuladores Java (Spring Boot) - coexisten con emulador TypeScript
  emulator-java:
    build:
      context: ./SafeAir-System-Emulator
      dockerfile: Dockerfile
    container_name: safeair-emulator-java
    restart: unless-stopped
    environment:
      # Usar MQTT del broker EMQX local (sin TLS para desarrollo local)
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS_ENABLED: "false"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_CONSOLE_LOG_ENABLED: "true"
      # Perfil con 2 emuladores: EMU-0001 y EMU-0002
      SPRING_PROFILES_ACTIVE: profile1
    depends_on:
      mqtt:
        condition: service_healthy
    ports:
      - "8081:8080"  # Puerto diferente al frontend (80) y API (3000)
    networks:
      - safeair-network

volumes:
  db_data:
  mqtt_data:
  mqtt_log:

networks:
  safeair-network:
    driver: bridge
