services:
  # =============================================
  # PostgreSQL - Base de datos
  # =============================================
  db:
    image: postgres:16
    container_name: safeair-db
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeair}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "6543:5432"  # Puerto externo: interno
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Api_Emuladores/database/sql:/docker-entrypoint-initdb.d:Z
    networks:
      - safeair-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # EMQX - Broker MQTT (OBLIGATORIO, no cambiar a Mosquitto)
  # =============================================
  mqtt:
    image: emqx/emqx:latest
    container_name: safeair-mqtt
    restart: unless-stopped
    env_file:
      - ./.env.emqx
    environment:
      # EMQX permite conexiones anónimas para desarrollo local
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_LOG_LEVEL: "info"
      EMQX_DASHBOARD__LISTENERS__HTTP__INET6: "false"
    ports:
      - "1883:1883"    # MQTT TCP - para emuladores
      - "8883:8883"    # MQTT over TLS - para producción segura
      - "8084:8084"    # MQTT WebSocket - para frontend/suscriptores web
      - "18083:18083"  # Dashboard EMQX - solo para debugging local
    volumes:
      - mqtt_data:/opt/emqx/data
      - mqtt_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - safeair-network

  # =============================================
  # API / Backend - Servicio principal
  # =============================================
  api:
    build:
      context: ./Api_Emuladores
    container_name: safeair-api
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PORT: 5432
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt:1883}
      BACKEND_BIND_HOST: ${API_HOST:-0.0.0.0}
      BACKEND_PORT: 3000
      PORT: 3000
      # CORSovýnamic desde .env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8080}
      # MODO DEMO - Omitir OTP
      AUTH_SKIP_OTP: "true"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    ports:
      - "3000:3000"  # Puerto para acceder desde otra laptop en LAN
    networks:
      - safeair-network

  # =============================================
  # Frontend - Interfaz de usuario
  # =============================================
  frontend:
    build:
      context: ./Frontend_SafeAir
      args:
        # Por defecto conecta al API en la misma máquina
        # Para LAN, cambiar a: --build-arg API_BASE_URL=http://192.168.x.x:3000
        API_BASE_URL: ${API_BASE_URL:-api:3000}
    container_name: safeair-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"  # Puerto HTTP
      - "8443:443" # Puerto HTTPS (si se configura SSL)
    networks:
      - safeair-network

  # =============================================
  # Emuladores - Dispositivos IoT simulados
  # =============================================
  emulator-java:
    build:
      context: ./SafeAir-System-Emulator
      dockerfile: Dockerfile
    container_name: safeair-emulator-java
    restart: unless-stopped
    environment:
      # Conectar a EMQX en el mismo equipo (docker-compose)
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TLS_ENABLED: "false"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_CONSOLE_LOG_ENABLED: "true"
      # Perfil con 2 emuladores: EMU-0001 y EMU-0002
      SPRING_PROFILES_ACTIVE: profile1
    depends_on:
      mqtt:
        condition: service_healthy
    ports:
      - "8081:8080"  # Puerto para debugging del emulador Java
    networks:
      - safeair-network

# =============================================
# Volumes persistentes
# =============================================
volumes:
  db_data:
  mqtt_data:
  mqtt_log:

# =============================================
# Red de Docker
# =============================================
networks:
  safeair-network:
    driver: bridge
