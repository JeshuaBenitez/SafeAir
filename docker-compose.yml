services:
  db:
    image: postgres:16
    container_name: safeair-db
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "6543:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Api_Emuladores/database/sql:/docker-entrypoint-initdb.d:Z

  mqtt:
    image: emqx/emqx:latest
    container_name: safeair-mqtt
    restart: unless-stopped
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_LOG_LEVEL: info
    ports:
      - "1883:1883"      # MQTT TCP
      - "8883:8883"      # MQTT over TLS
      - "8084:8084"      # WebSocket
      - "18083:18083"    # Dashboard web (usuario: admin, contraseña: public)

  api:
    build:
      context: ./Api_Emuladores
    container_name: safeair-api
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MQTT_URL: mqtt://mqtt:1883
      BACKEND_BIND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      PORT: 3000
    depends_on:
      - db
      - mqtt
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./Frontend_SafeAir
    container_name: safeair-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
