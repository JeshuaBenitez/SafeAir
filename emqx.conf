# EMQX Configuration for SafeAir
# Configuración EMQX para SafeAir

listeners.tcp.default.bind = 0.0.0.0:1883
listeners.tcp.default.acceptors = 16000

listeners.ws.default.bind = 0.0.0.0:8084
listeners.ws.default.acceptors = 16000

# Allow anonymous connections (development only)
authorization.allow_anonymous = true

# Log level: debug, info, warning, error
log.console.level = info

# Max connections
max_connections = 1000000

# Enable dashboard
dashboard.listener.http = 18083
