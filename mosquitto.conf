# ============================================================================
# SafeAir MQTT Broker Configuration / Configuración del Broker MQTT
# ============================================================================
# Este archivo configura Mosquitto v2.x para permitir el desarrollo distribuido.
#
# ¿Por qué es especial este archivo?
# A partir de la versión 2.0 de Mosquitto, el broker de mensajería por defecto:
# 1. Bloquea todas las conexiones externas conectándose solo a localhost (127.0.0.1).
# 2. Deniega las conexiones anónimas que no posean usuario/contraseña.
#
# Para una configuración en red distribuida (multi-laptop), este archivo anula
# esas restricciones permitiendo la conexión del backend y los emuladores externos.
# ============================================================================

# 1. Configuración de puerto estándar MQTT (TCP)
# Escucha en el puerto 1883 en todas las interfaces de red (0.0.0.0)
listener 1883 0.0.0.0

# 2. Permitir conexiones anónimas (solo para entorno de desarrollo y pruebas)
allow_anonymous true

# 3. Puerto para WebSockets (WS)
# Opcional: Escucha en el puerto 8083 con protocolo websocket para compatibilidad directa con navegadores
listener 8083 0.0.0.0
protocol websocket
