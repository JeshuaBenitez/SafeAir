spring:
  config:
    activate:
      on-profile: profile1

mqtt:
  enabled: true
  host: ${MQTT_HOST:localhost}
  port: ${MQTT_PORT:1883}
  tls:
    enabled: ${MQTT_TLS_ENABLED:false}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  console-log-enabled: ${MQTT_CONSOLE_LOG_ENABLED:false}
  client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:safeair-emulator}
  keep-alive-seconds: ${MQTT_KEEP_ALIVE_SECONDS:60}
  connection-timeout-seconds: ${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
  max-inflight: ${MQTT_MAX_INFLIGHT:100}
  publish-warning-interval-seconds: ${MQTT_PUBLISH_WARNING_INTERVAL_SECONDS:30}
  telemetry-pending-capacity: ${MQTT_TELEMETRY_PENDING_CAPACITY:100}
  telemetry-retry-delay-millis: ${MQTT_TELEMETRY_RETRY_DELAY_MILLIS:1000}
  log-stacktrace: ${SAFEAIR_MQTT_LOG_STACKTRACE:false}

safeair:
  profile1:
    emulators:
      - emulatorId: ${SAFEAIR_EMULATOR_ID_1:EMU-DEMO-R001}
        updateIntervalSec: 1
        roomSquareMeters: 35
        windowCount: 1
        # Sensor types: 1=Humidity, 2=Temperature, 3=PM2.5, 4=CO2
        sensorTypes: [1, 2, 3, 4]
        # Device types: 1=MiniSplit, 2=HumidifierPurifier, 3=AirExtractor
        deviceTypes: [1, 2, 3]

      - emulatorId: ${SAFEAIR_EMULATOR_ID_2:EMU-DEMO-R002}
        updateIntervalSec: 2
        roomSquareMeters: 60
        windowCount: 3
        sensorTypes: [2, 4]
        deviceTypes: [1, 3]

      - emulatorId: ${SAFEAIR_EMULATOR_ID_3:EMU-DEMO-R003}
        updateIntervalSec: 2
        roomSquareMeters: 40
        windowCount: 2
        sensorTypes: [1, 2, 3, 4]
        deviceTypes: [1, 2, 3]
