name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  quality-gates:
    name: Quality Gates & Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Compile and Validate Code Style
      run: |
        mvn clean compile
        mvn checkstyle:check
        
    - name: Run Static Analysis (SpotBugs)
      run: mvn spotbugs:check
      
    - name: Run Unit Tests with Coverage
      run: mvn test jacoco:report
      
    - name: Run Integration Tests
      run: mvn verify -DskipUnitTests=false
      
    - name: Enforce Coverage Thresholds
      run: mvn jacoco:check
      
    - name: Upload Coverage to Codecov
      if: github.event_name == 'push'
      uses: codecov/codecov-action@v3
      with:
        file: target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        
    - name: Upload JaCoCo Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-reports
        path: target/site/jacoco/
        retention-days: 7
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 7

  build-and-test:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Package Application
      run: mvn clean package -DskipTests
      
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: safe-air-emulator-jar
        path: target/*.jar
        retention-days: 7

  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker Image
      run: |
        docker buildx build \
          --tag safe-air-emulator:${{ github.sha }} \
          --tag safe-air-emulator:latest \
          --load \
          .
          
    - name: Run Container Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: safe-air-emulator:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        
    - name: Upload Security Scan Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-sarif-results
        path: trivy-results.sarif
        retention-days: 7

  constitutional-compliance:
    name: Constitutional Compliance Check
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Verify UML Conformance Document
      run: |
        if [[ ! -f "specs/001-foundation-local-emulation/uml-conformance.md" ]]; then
          echo "❌ UML conformance document missing"
          exit 1
        fi
        echo "✅ UML conformance document present"
        
    - name: Verify Package Structure
      run: |
        # Check constitutional package structure
        REQUIRED_PACKAGES=(
          "src/main/java/com/safeair/emulator/abstracts"
          "src/main/java/com/safeair/emulator/api/client"
          "src/main/java/com/safeair/emulator/api/dto"
          "src/main/java/com/safeair/emulator/api/mqtt"
          "src/main/java/com/safeair/emulator/emulation/core"
          "src/main/java/com/safeair/emulator/emulation/impl"
          "src/main/java/com/safeair/emulator/emulation/simulation"
          "src/main/java/com/safeair/emulator/manager"
          "src/main/java/com/safeair/emulator/config"
        )
        
        for pkg in "${REQUIRED_PACKAGES[@]}"; do
          if [[ ! -d "$pkg" ]]; then
            echo "❌ Missing required package: $pkg"
            exit 1
          fi
        done
        echo "✅ All constitutional packages present"
        
    - name: Verify Factory Enforcement
      run: |
        # Check that factory classes exist
        FACTORIES=(
          "src/main/java/com/safeair/emulator/emulation/impl/SensorFactory.java"
          "src/main/java/com/safeair/emulator/emulation/impl/ElectrodomesticFactory.java"
        )
        
        for factory in "${FACTORIES[@]}"; do
          if [[ ! -f "$factory" ]]; then
            echo "❌ Missing required factory: $factory"
            exit 1
          fi
        done
        echo "✅ Factory enforcement verified"
        
    - name: Check for Code Quality Issues
      run: |
        # Check for TODO comments and unused imports (basic scan)
        TODO_COUNT=$(find src -name "*.java" -exec grep -l "TODO\|FIXME\|XXX" {} \; | wc -l)
        if [[ $TODO_COUNT -gt 0 ]]; then
          echo "❌ Found $TODO_COUNT files with TODO/FIXME comments"
          find src -name "*.java" -exec grep -l "TODO\|FIXME\|XXX" {} \;
          exit 1
        fi
        echo "✅ No TODO/FIXME comments found"

  coverage-report:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.event_name == 'push'
    
    steps:
    - name: Download Coverage Report
      uses: actions/download-artifact@v4
      with:
        name: jacoco-coverage-reports
        path: coverage/
        
    - name: Generate Coverage Badge
      run: |
        # Extract coverage percentage from JaCoCo report
        if [[ -f "coverage/index.html" ]]; then
          echo "Coverage report generated successfully"
        else
          echo "Coverage report not found"
          exit 1
        fi
        
    - name: Comment Coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '📊 **Coverage Report Generated** - Check the artifacts for detailed coverage metrics.'
          });