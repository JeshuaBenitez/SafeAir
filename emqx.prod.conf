# EMQX Configuration for Production
# Safe Air System - Production Broker Configuration

# =============================================================================
# LISTENERS - Puertos expuestos
# =============================================================================

# MQTT over TCP
listeners.tcp.default.bind = 0.0.0.0:1883
listeners.tcp.default.max_connections = 10000

# MQTT over TLS/SSL
listeners.ssl.default.bind = 0.0.0.0:8883
listeners.ssl.default.max_connections = 5000

# WebSocket MQTT
listeners.ws.default.bind = 0.0.0.0:8084
listeners.ws.default.max_connections = 5000

# HTTPS WebSocket
listeners.wss.default.bind = 0.0.0.0:8083
listeners.wss.default.max_connections = 5000

# Dashboard Web (solo admin local)
listeners.http.dashboard.bind = 127.0.0.1:18083

# =============================================================================
# AUTENTICACIÓN Y AUTORIZACIÓN
# =============================================================================

# Deshabilitar conexiones anónimas (requiere autenticación)
authorization.allow_anonymous = false

# Store passwords as hashed (bcrypt)
authorization.password_hash = bcrypt

# =============================================================================
# SEGURIDAD TLS/SSL
# =============================================================================

# Configuración SSL por defecto
listener.ssl.default.ssl_options.certfile = /etc/emqx/certs/cert.pem
listener.ssl.default.ssl_options.keyfile = /etc/emqx/certs/key.pem
listener.ssl.default.ssl_options.verify = verify_peer
listener.ssl.default.ssl_options.fail_if_no_peer_cert = true

# =============================================================================
# LIMITES DE CONEXIÓN
# =============================================================================

# Máximo de conexiones simultáneas
max_connections = 10000

# Máximo de conexiones por cliente IP
max_connections_per_client = 100

# =============================================================================
# MQTT PROTOCOLO
# =============================================================================

# KPIs obligatorias
mqtt.max_keepalive = 300
mqtt.max_topic_alias = 65535
mqtt.retain_available = true
mqtt.wildcard_available = true

# =============================================================================
# PERSISTENCIA Y CLUSTERING
# =============================================================================

# Persistencia en RAM (más rápido) o disco
# Para single node: usarbuilt-in default
# Para cluster: usar mria

# =============================================================================
# LOGGING
# =============================================================================

# Nivel de logs: debug, info, notice, warning, error, critical, alert, emergency
log.console.level = warning
log.file.level = warning

# =============================================================================
# DASHBOARD
# =============================================================================

# JWT para acceso al dashboard
dashboard.jwt_secret = ${EMQX_DASHBOARD__SECRETS__JWT_SECRET}

# Usuarios del dashboard (default)
dashboard.default_username = admin
dashboard.default_password = ${EMQX_DEFAULT_ADMIN_PASSWORD}

# =============================================================================
# MONITOREO Y METRICAS
# =============================================================================

# Habilitar API de estadísticas
api.key = ${EMQX_API_KEY}
api.secret = ${EMQX_API_SECRET}

# =============================================================================
# TRAFFIC SHAPING
# =============================================================================

# Rate limiting
listener.tcp.default.quota = 100000
listener.ssl.default.quota = 50000
listener.ws.default.quota = 50000
listener.wss.default.quota = 25000
